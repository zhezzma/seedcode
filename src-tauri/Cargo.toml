[package]
name = "seedcode"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "seedcode_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"
url = "2.5"
# 通知插件（社区版）：官方版 Android 点击链路不回传 extra（sourceJson 缺陷，plugins-workspace#2150），
# 该 fork 修复了全平台点击回传（notificationClicked 事件带 extra），供精确跳转 /chat/:id。
# 必须关闭默认 notify-rust 后端：否则 Windows/macOS 编译到 notify-rust 实现，仅支持进程存活时的
# 点击回传，无冷启动（应用未运行时点通知）链路。关闭后 Windows/macOS 使用原生 Toast /
# UNUserNotifications 后端（支持冷启动点击）；Linux 无原生实现，fork 自动回落 notify-rust。
# 注意：macOS 原生后端要求从 .app bundle 运行，tauri dev 直接跑裸二进制会初始化失败
# （fork 报错信息亦建议 dev 场景改用 notify-rust feature）。
tauri-plugin-notifications = { version = "0.5.0-rc.13", default-features = false }
tauri-plugin-log = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
log = "0.4"


# WebSocket 使用 native-tls (在 Windows/Linux 上使用系统 SSL，Android 上我们需要手动编译 OpenSSL)
# WS 消息需在 Rust 层直接处理（check_notification → 系统通知），因此用 tungstenite 而非 tauri-plugin-websocket 的 JS 通道
tauri-plugin-websocket = { version = "2", default-features = false, features = ["native-tls"] }
# 原生剪贴板写入：WebView 的 navigator.clipboard 异步写入会被 Windows
# 剪贴板历史（Win+V）按隐私数据处理而排除，复制按钮统一走 invoke 到
# lib.rs 的 write_clipboard_text / write_clipboard_image（前端封装见 src/utils/clipboard.ts）。
# 仅桌面平台依赖（arboard 不支持移动端 target，lib.rs 中引用也已用 cfg(desktop) 隔离）。
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
arboard = "3"
# Android 平台特有配置：强制编译 OpenSSL (vendored)，因为 Android 系统不提供标准 OpenSSL 库
[target.'cfg(target_os = "android")'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }

[target.'cfg(target_os = "windows")'.dependencies]
tauri-plugin-single-instance = "2"
# 子进程绑 Job Object（KILL_ON_JOB_CLOSE）：父进程任何方式退出（含崩溃/强杀/Ctrl+C）
# 内核都会收掉 node 进程树，不依赖 RunEvent::Exit 钩子
win32job = "2"
# Windows 原生 Toast 的 AUMID 注册依赖：未 MSIX 打包的应用必须在开始菜单有带
# System.AppUserModel.ID 的快捷方式，否则 CreateToastNotifierWithId(identifier)
# 会被系统拒绝（Element not found）。win_toast.rs 启动时自建/自愈该快捷方式。
# Win32_UI_Notifications：通知中心点击回传的 COM 接口 INotificationActivationCallback；
# Win32_System_Registry：自愈 CustomActivator/LocalServer32 注册表键。
# 版本对齐 tauri-plugin-notifications 的 windows 0.61，避免重复编译。
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_Notifications",
] }
# #[implement(...)] 宏（windows-implement）展开为 ::windows_core:: 绝对路径，
# 只能解析当前 crate 的直接依赖——经 windows 传递引入的不在 extern prelude，
# 缺这条会导致 E0433 "cannot find windows_core in the crate root"。
# 版本与上方 windows 对齐（与通知插件 fork 的写法一致）。
windows-core = "0.61"

